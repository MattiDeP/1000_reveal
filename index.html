<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1000 REVEAL</title>
  <!-- Tailwind CSS via CDN per lo stile -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Libreria ufficiale Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8 font-sans">

  <div class="max-w-3xl mx-auto space-y-6">
    
    <!-- Titolo -->
    <header class="bg-slate-900 text-white p-6 rounded-2xl shadow-md flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">1000 REVEAL</h1>
        <p class="text-slate-400 text-sm">bismillah</p>
      </div>
    </header>

    <!-- CHECK GIORNALIERO -->
    <div id="check-banner" class="p-4 rounded-xl border flex items-center gap-3 shadow-sm bg-white border-slate-200">
      <div id="check-icon" class="text-2xl"></div>
      <div>
        <h2 id="check-title" class="font-bold text-sm uppercase tracking-wider text-slate-500">Verifica in corso...</h2>
        <p id="check-desc" class="text-sm text-slate-600">Controllo il database</p>
      </div>
    </div>

    <!-- FORM DI INSERIMENTO -->
    <form id="turno-form" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
      <h3 class="font-bold text-lg text-slate-800 border-b pb-2">Nuovo reveal</h3>

      <!-- Radio Button Unità Treno -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Seleziona Unità Treno</label>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">

          <label class="cursor-pointer">
            <input type="radio" name="unita" value="ETR400" class="peer sr-only">
            <div class="p-3 text-center rounded-xl border border-slate-200 peer-checked:border-blue-600 peer-checked:bg-blue-50 peer-checked:text-blue-700 font-medium text-sm transition">
              ETR 400
            </div>
          </label>

          <label class="cursor-pointer">
            <input type="radio" name="unita" value="ETR410" class="peer sr-only">
            <div class="p-3 text-center rounded-xl border border-slate-200 peer-checked:border-blue-600 peer-checked:bg-blue-50 peer-checked:text-blue-700 font-medium text-sm transition">
              ETR 410
            </div>
          </label>

        </div>
      </div>

      <!-- Campo Numerico & Operatore -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label for="numero-treno" class="block text-sm font-semibold text-slate-700 mb-1">Numero 1000</label>
          <input type="number" id="numero-treno" required placeholder="scrivi l'unita'" class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label for="operatore" class="block text-sm font-semibold text-slate-700 mb-1">Memorizzato da</label>
          <input type="text" id="operatore" required placeholder="Il tuo nome" class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label for="data-turno" class="block text-sm font-semibold text-slate-700 mb-1">Data</label>
          <input type="date" id="data-turno" required class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <button type="submit" id="btn-salva" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-xl shadow-sm transition cursor-pointer">
        Salva il reveal
      </button>
    </form>

    <!-- TABELLA STORICO -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-5 border-b border-slate-200 flex justify-between items-center">
        <h3 class="font-bold text-lg text-slate-800">Storico Turnazioni</h3>
        <span id="conteggio-record" class="text-xs font-medium bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full">0 record</span>
      </div>
      
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
              <th class="py-3 px-4">Data</th>
              <th class="py-3 px-4">Unità Treno</th>
              <th class="py-3 px-4">Numero</th>
              <th class="py-3 px-4">Memorizzato da:</th>
              <th class="py-3 px-4 text-right">Azioni</th>
            </tr>
          </thead>
          <tbody id="tabella-body" class="divide-y divide-slate-100 text-sm">
            <tr>
              <td colspan="5" class="py-8 text-center text-slate-400">Caricamento dati...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
